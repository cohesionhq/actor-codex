name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(git ls-files -- '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # TestLiveCodex skips: it needs a real, signed-in Codex.
      - run: go test -race ./...
